<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#122E52"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#4FD8C9"/>
      <stop offset="1" stop-color="#1B8FA0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)"/>

  <!-- Connection lines -->
  <g stroke="#2E6FA8" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="12" x2="32" y2="50"/>
    <line x1="12" y1="32" x2="52" y2="32"/>
  </g>
  <g stroke="#4FD8C9" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="32" y1="22" x2="32" y2="42"/>
    <line x1="21" y1="32" x2="43" y2="32"/>
  </g>

  <!-- Outer nodes (supervised) -->
  <g fill="#22A8B8">
    <circle cx="32" cy="11" r="4.6"/>
    <circle cx="32" cy="53" r="4.6"/>
    <circle cx="11" cy="32" r="4.6"/>
    <circle cx="53" cy="32" r="4.6"/>
  </g>

  <!-- EYE hub: almond shape -->
  <path d="M 15 32 Q 32 17 49 32 Q 32 47 15 32 Z" fill="#FFFFFF" stroke="#4FD8C9" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Iris -->
  <circle cx="32" cy="32" r="7.6" fill="url(#iris)"/>
  <!-- Pupil -->
  <circle cx="32" cy="32" r="3.4" fill="#0B1F3A"/>
  <!-- Highlight -->
  <circle cx="34.6" cy="29.4" r="1.5" fill="#FFFFFF" opacity="0.95"/>
</svg>
